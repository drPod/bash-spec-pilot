- name: Benchmark candidate
  hosts: all
  gather_facts: false
  tasks:
  - ansible.builtin.stat:
      path: /work/enabled
    register: enabled
  - ansible.builtin.file:
      path: /work/cache
      state: directory
    when: enabled.stat.exists
  - name: Independent review challenge
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import shutil,os; shutil.rmtree('/work/cache'); os.symlink('/tmp','/work/cache')
