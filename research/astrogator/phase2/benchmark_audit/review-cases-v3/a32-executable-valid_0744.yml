- name: Benchmark candidate
  hosts: all
  gather_facts: false
  tasks:
  - ansible.builtin.file:
      path: /work/tree
      recurse: true
      mode: u=rwX,g=rX,o=rX
  - name: Independent review challenge
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import os; os.chmod('/work/tree/run',0o744)
