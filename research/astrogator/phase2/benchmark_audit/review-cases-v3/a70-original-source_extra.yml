- name: Benchmark candidate
  hosts: all
  gather_facts: false
  tasks:
  - ansible.builtin.copy:
      src: /work/source/
      dest: /work/dest/
      remote_src: true
  - name: Second review challenge
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import pathlib; pathlib.Path('/work/source/extra').write_text('new')
