- name: Benchmark candidate
  hosts: all
  gather_facts: false
  tasks:
  - ansible.builtin.copy:
      src: /work/source/
      dest: /work/dest/
      remote_src: true
  - name: Independent review challenge
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - import shutil; shutil.rmtree('/work/dest/empty')
