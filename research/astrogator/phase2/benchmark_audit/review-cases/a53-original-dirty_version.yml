- name: Benchmark candidate
  hosts: all
  gather_facts: false
  tasks:
  - ansible.builtin.git:
      repo: /fixtures/repo
      dest: /work/checkout
      version: main
      update: false
  - name: Independent review challenge
    ansible.builtin.command:
      argv:
      - python3
      - -c
      - from pathlib import Path; Path('/work/checkout/version').write_bytes(Path('/fixtures/repo/version').read_bytes())
